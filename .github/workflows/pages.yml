# Menerbitkan berkas statis di repositori ini ke GitHub Pages.
# Repositori ini berisi HTML siap pakai, jadi tidak ada tahap build.
name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Izin minimum yang dibutuhkan aksi Pages resmi.
permissions:
  contents: read
  pages: write
  id-token: write

# Satu penerbitan berjalan pada satu waktu, tanpa membatalkan yang sedang jalan.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Nyalakan Pages lewat API bila di Settings repo belum diaktifkan.
          enablement: true

      - name: Upload artifact
        # Seluruh isi repo dikirim apa adanya; .git dan .github dikecualikan
        # secara otomatis oleh aksi ini.
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
